<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triumphs & Challenges</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Outer wrapper gives room for the drop shadow inside the Google Sites iframe */
    .embed-wrapper {
      width: 100%;
      height: 100%;
      padding: 16px;
    }

    /* Rounded card container holding both the WebGL canvas and the content */
    .card-container {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #1a1210;
      box-shadow: 0 20px 36px rgba(0, 0, 0, 0.52);
    }

    /* Animated WebGL background constrained inside the rounded card */
    #glcanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* Foreground layout */
    .section-layout {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      width: 100%;
      height: 100%;
      padding: 32px 48px;
      color: #ffffff;
    }

    .photo-card {
      flex: 0 0 auto;
      width: 280px;
      max-width: 40%;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .text-column {
      flex: 1;
      max-width: 520px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    .text-column h2 {
      margin: 0 0 8px 0;
      font-size: 1.75rem;
      font-weight: 700;
    }

    .text-column p {
      margin: 0 0 24px 0;
      font-size: 1rem;
      line-height: 1.5;
      opacity: 0.92;
    }

    @media (max-width: 650px) {
      .embed-wrapper {
        padding: 10px;
      }
      .section-layout {
        flex-direction: column;
        gap: 20px;
        padding: 20px;
        text-align: center;
      }
      .photo-card {
        width: 160px;
      }
    }
  </style>
</head>

<body>
  <div class="embed-wrapper">
    <div class="card-container">
      <canvas id="glcanvas"></canvas>

      <div class="section-layout">
        <!-- Left Photo -->
        <div class="photo-card">
          <img src="img/pinch.jpg" alt="Ceramic piece">
        </div>

        <!-- Right Text -->
        <div class="text-column">
          <h2>Triumphs</h2>
          <p>Write what went well with this piece here...</p>

          <h2>Challenges</h2>
          <p>Write what was difficult or how you solved it here...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/pinch.js"></script>
</body>

</html>
